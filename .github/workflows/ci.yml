name: Build

on:
  push:
    branches:
      - chn-0.34.1-base
    tags:
      - '0.34.1-zh[0-9]*-[0-9]*-[0-9][0-9][0-9]'
  pull_request:
    branches:
      - chn-0.34.1-base
  schedule:
    - cron: '17 18 * * *'
  workflow_dispatch:
    inputs:
      run_full_runtime:
        description: 'Run full runtime tests (L1+L2+L3, slow)'
        type: boolean
        default: false

permissions: {}
jobs:
  zh_tooling_tests:
    permissions:
      contents: read

    name: ZH Tooling Tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      PYTHONSAFEPATH: "1"
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0
          submodules: true
      - name: Set up Python from .python-version
        uses: actions/setup-python@v4
        with:
          python-version-file: .python-version
      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install tooling test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install tree-sitter==0.26.0 tree-sitter-cpp==0.23.4 pyyaml
      - name: Build vendored luac (monspeak Lua syntax gate)
        run: |
          cd crawl-ref/source/contrib/lua/src
          luac_link_flags=(-lm)
          if [[ "$RUNNER_OS" == "Linux" ]]; then
            luac_link_flags+=(-ldl)
          fi
          cc -O2 -o luac -I. luac.c lapi.c lauxlib.c lbaselib.c lcode.c \
             lcorolib.c lctype.c ldblib.c ldebug.c ldo.c ldump.c lfunc.c \
             lgc.c linit.c liolib.c llex.c lmathlib.c lmem.c loadlib.c \
             lobject.c lopcodes.c loslib.c lparser.c lstate.c lstring.c \
             lstrlib.c ltable.c ltablib.c ltm.c lundump.c lutf8lib.c \
             lvm.c lzio.c "${luac_link_flags[@]}"
      - name: Run tooling tests
        run: |
          /bin/bash .claude/scripts/tests/run_all.sh
        env:
          # GitHub-hosted runners have ~7 GB RAM; the monspeak inventory
          # suite (66 tests) plus the other heavy inventory tests OOM at
          # the default 4-way concurrency. 2-way fits within the budget.
          ZH_TOOLING_TEST_JOBS: "2"
      - name: Upload verification evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: verify-evidence-${{ matrix.os }}
          path: .claude/metrics/verify/
          if-no-files-found: ignore

  zh_ci_gate:
    permissions:
      contents: read

    name: ZH CI Gate (static + data, no make, ${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      PYTHONSAFEPATH: "1"
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0
          submodules: true
      - name: Set up Python from .python-version
        uses: actions/setup-python@v4
        with:
          python-version-file: .python-version
      - name: Install static check dependencies
        run: |
          python -m pip install --upgrade pip
          pip install tree-sitter==0.26.0 tree-sitter-cpp==0.23.4 pyyaml
      - name: Build vendored luac (monspeak Lua syntax gate)
        run: |
          cd crawl-ref/source/contrib/lua/src
          luac_link_flags=(-lm)
          if [[ "$RUNNER_OS" == "Linux" ]]; then
            luac_link_flags+=(-ldl)
          fi
          cc -O2 -o luac -I. luac.c lapi.c lauxlib.c lbaselib.c lcode.c \
             lcorolib.c lctype.c ldblib.c ldebug.c ldo.c ldump.c lfunc.c \
             lgc.c linit.c liolib.c llex.c lmathlib.c lmem.c loadlib.c \
             lobject.c lopcodes.c loslib.c lparser.c lstate.c lstring.c \
             lstrlib.c ltable.c ltablib.c ltm.c lundump.c lutf8lib.c \
             lvm.c lzio.c "${luac_link_flags[@]}"
      - name: Run Chinese localization CI gate (static only)
        run: |
          /bin/bash .claude/scripts/verify_zh.sh --profile ci
      - name: Upload verification evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: verify-evidence-ci-${{ matrix.os }}
          path: .claude/metrics/verify/
          if-no-files-found: ignore

  zh_runtime_catch2:
    permissions:
      contents: read

    name: ZH Runtime Catch2 ([zh-translation] + [message-overlay])
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0
          submodules: true
      - name: Set up Python from .python-version
        uses: actions/setup-python@v4
        with:
          python-version-file: .python-version
      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml
          sudo .github/workflows/deps.py --compiler gcc --build-opts "" --debug-opts "FULLDEBUG=1"
      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: zh-runtime-catch2
          restore-keys: zh-runtime-catch2
      - name: "Setup ccache: prepend path"
        run: "echo /usr/lib/ccache >> $GITHUB_PATH"
      - name: "Setup ccache: update symlinks"
        run: "/usr/sbin/update-ccache-symlinks"
      - name: Ensure version info
        run: bash .claude/scripts/ensure_version_info.sh
      - name: Build catch2-tests and run [zh-translation] + [message-overlay]
        run: bash .claude/scripts/post_zh_runtime.sh catch2
        env:
          TERM: dumb
      - name: Build bundled-PCRE Catch2 tests and run the PCRE regression
        run: |
          make clean
          make catch2-tests-executable BUILD_PCRE=y COVERAGE=YesPlease PYTHON=python3 -j4
          ./catch2-tests-executable '[pcre-regression]'
        working-directory: crawl-ref/source

  zh_runtime_full:
    permissions:
      contents: read

    name: ZH Runtime Full (L1+L2+L3)
    if: ${{ github.event_name == 'schedule' || startsWith(github.ref, 'refs/tags/0.34.1-zh') || (github.event_name == 'workflow_dispatch' && github.event.inputs.run_full_runtime == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0
          submodules: true
      - name: Set up Python from .python-version
        uses: actions/setup-python@v4
        with:
          python-version-file: .python-version
      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml
          sudo .github/workflows/deps.py --compiler gcc --build-opts "" --debug-opts "FULLDEBUG=1"
      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: zh-runtime-full
          restore-keys: zh-runtime-full
      - name: "Setup ccache: prepend path"
        run: "echo /usr/lib/ccache >> $GITHUB_PATH"
      - name: "Setup ccache: update symlinks"
        run: "/usr/sbin/update-ccache-symlinks"
      - name: Ensure version info
        run: bash .claude/scripts/ensure_version_info.sh
      - name: Build and run full ZH runtime (L1+L2+L3)
        run: bash .claude/scripts/post_zh_runtime.sh full
        env:
          TERM: dumb

  zh_help_runtime:
    permissions:
      contents: read

    name: ZH Help Runtime Tests (Issue 52)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0
          submodules: true
      - name: Set up Python from .python-version
        uses: actions/setup-python@v4
        with:
          python-version-file: .python-version
      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install tree-sitter==0.26.0 tree-sitter-cpp==0.23.4 pyyaml
          sudo .github/workflows/deps.py --compiler gcc --build-opts "" --debug-opts "FULLDEBUG=1"
      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: zh-help-runtime
          restore-keys: zh-help-runtime
      - name: "Setup ccache: prepend path"
        run: "echo /usr/lib/ccache >> $GITHUB_PATH"
      - name: "Setup ccache: update symlinks"
        run: "/usr/sbin/update-ccache-symlinks"
      - name: Ensure version info
        run: bash .claude/scripts/ensure_version_info.sh
      - name: Build and run help-system runtime tests
        run: bash .claude/scripts/post_zh_runtime.sh help-full
        env:
          TERM: dumb

  linting:
    if: github.event_name != 'schedule'
    permissions:
      contents: read #  to fetch code (actions/checkout)

    name: Code Linting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0
      - name: Set up Python from .python-version
        uses: actions/setup-python@v4
        with:
          python-version-file: .python-version
      - name: Select changed source files
        id: lint_targets
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          case "$EVENT_NAME" in
            pull_request)
              base="$PR_BASE_SHA"
              head="$PR_HEAD_SHA"
              ;;
            push)
              base="$BEFORE_SHA"
              head="$GITHUB_SHA"
              if [[ "$base" =~ ^0+$ ]]; then
                base="$GITHUB_SHA^"
              fi
              ;;
            workflow_dispatch)
              base="$GITHUB_SHA^"
              head="$GITHUB_SHA"
              ;;
            *)
              echo "Unsupported lint event: $EVENT_NAME" >&2
              exit 1
              ;;
          esac

          git cat-file -e "$base^{commit}"
          git cat-file -e "$head^{commit}"
          git -C crawl-ref/source diff --name-only --relative \
            --diff-filter=ACMR -z \
            "$base" "$head" -- . > "$RUNNER_TEMP/lint-source-files"
      - name: Checkwhite
        shell: bash
        run: |
          set -euo pipefail
          mapfile -d '' files < "$RUNNER_TEMP/lint-source-files"
          if (( ${#files[@]} == 0 )); then
            echo "No changed source files to check."
            exit 0
          fi
          util/checkwhite -n "${files[@]}"
        working-directory: crawl-ref/source
      - name: Unbrace
        if: ${{ always() && steps.lint_targets.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          mapfile -d '' changed < "$RUNNER_TEMP/lint-source-files"
          files=()
          for file in "${changed[@]}"; do
            case "$file" in
              *.cc|*.h) files+=("$file") ;;
            esac
          done
          if (( ${#files[@]} == 0 )); then
            echo "No changed C++ source files to check."
            exit 0
          fi
          util/unbrace -n "${files[@]}"
        working-directory: crawl-ref/source
      - name: Check commit message line lengths
        if: ${{ always() && github.event_name == 'pull_request' }}
        run: util/checkconventionalcommit.py
        working-directory: crawl-ref/source
        continue-on-error: true

  build_linux_console:
    permissions:
      contents: read

    name: Linux Console (GCC)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0
          submodules: true
      - name: Set up Python from .python-version
        uses: actions/setup-python@v4
        with:
          python-version-file: .python-version
      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml
          sudo .github/workflows/deps.py --compiler gcc --build-opts ""
      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: build-linux-console
          restore-keys: build-linux-console
      - name: "Setup ccache: prepend path"
        run: "echo /usr/lib/ccache >> $GITHUB_PATH"
      - name: "Setup ccache: update symlinks"
        run: "/usr/sbin/update-ccache-symlinks"
      - name: Ensure version info
        run: bash .claude/scripts/ensure_version_info.sh
      - name: Build Linux console
        run: make -j4
        working-directory: crawl-ref/source

  build_macos_tiles:
    permissions:
      contents: read

    name: macOS Tiles App
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0
          submodules: true
      - name: Set up Python from .python-version
        uses: actions/setup-python@v4
        with:
          python-version-file: .python-version
      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml
      - name: Ensure version info
        run: bash .claude/scripts/ensure_version_info.sh
      - name: Build macOS tiles app
        run: make -j4 TILES=y mac-app-tiles-dmg
        working-directory: crawl-ref/source
      - name: Upload macOS tiles app
        uses: actions/upload-artifact@v4
        with:
          name: macos-tiles-app
          path: |
            crawl-ref/source/mac-app-zips/*.dmg
            !crawl-ref/source/mac-app-zips/latest.dmg
          if-no-files-found: error

  build_windows_tiles:
    permissions:
      contents: read

    name: Windows Tiles (MinGW64 cross-compile)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0
          submodules: true
      - name: Set up Python from .python-version
        uses: actions/setup-python@v4
        with:
          python-version-file: .python-version
      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml
          sudo .github/workflows/deps.py --crosscompile --build-opts TILES=1
      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: build-windows-tiles
          restore-keys: build-windows-tiles
      - name: "Setup ccache: prepend path"
        run: "echo /usr/lib/ccache >> $GITHUB_PATH"
      - name: "Setup ccache: update symlinks"
        run: "/usr/sbin/update-ccache-symlinks"
      - name: Ensure version info
        run: bash .claude/scripts/ensure_version_info.sh
      - name: Build Windows tiles package
        run: make CROSSHOST=x86_64-w64-mingw32 package-windows-tiles -j4
        working-directory: crawl-ref/source
      - name: Upload Windows tiles package
        uses: actions/upload-artifact@v4
        with:
          name: windows-tiles
          path: |
            crawl-ref/source/stone_soup-*-tiles-win32.zip
            !crawl-ref/source/stone_soup-latest-tiles-win32.zip
          if-no-files-found: error

  build_android:
    permissions:
      contents: read

    name: Android (buildTest)
    runs-on: ubuntu-latest
    env:
      NDK_CCACHE: ccache
      ANDROID_TEST_CERT_SHA256: ab57cadd85e4cc2cc94cc6107e7f929080acf3a58e3c1134b37f6066c337c287
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0
          submodules: true
      - name: Require Android test signing secrets
        if: ${{ github.event_name != 'pull_request' }}
        shell: bash
        env:
          ANDROID_TEST_KEYSTORE_BASE64: ${{ secrets.ANDROID_TEST_KEYSTORE_BASE64 }}
          ANDROID_TEST_KEYSTORE_PASS: ${{ secrets.ANDROID_TEST_KEYSTORE_PASS }}
          ANDROID_TEST_KEY_ALIAS: ${{ secrets.ANDROID_TEST_KEY_ALIAS }}
        run: |
          set -euo pipefail
          : "${ANDROID_TEST_KEYSTORE_BASE64:?missing GitHub Actions secret ANDROID_TEST_KEYSTORE_BASE64}"
          : "${ANDROID_TEST_KEYSTORE_PASS:?missing GitHub Actions secret ANDROID_TEST_KEYSTORE_PASS}"
          : "${ANDROID_TEST_KEY_ALIAS:?missing GitHub Actions secret ANDROID_TEST_KEY_ALIAS}"
      - name: Require Android release signing secrets
        if: ${{ startsWith(github.ref, 'refs/tags/0.34.1-zh') }}
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASS }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF_NAME" =~ ^0\.34\.1-zh[1-9][0-9]*-[1-9][0-9]*-(00[1-9]|0[1-9][0-9]|[1-9][0-9]{2})$ ]]
          : "${ANDROID_KEYSTORE_BASE64:?missing GitHub Actions secret ANDROID_KEYSTORE_BASE64}"
          : "${ANDROID_KEYSTORE_PASS:?missing GitHub Actions secret ANDROID_KEYSTORE_PASS}"
          : "${ANDROID_KEY_ALIAS:?missing GitHub Actions secret ANDROID_KEY_ALIAS}"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" \
            | base64 --decode > "$RUNNER_TEMP/android-release.keystore"
          [[ -s "$RUNNER_TEMP/android-release.keystore" ]]
          chmod 600 "$RUNNER_TEMP/android-release.keystore"
      - name: Set up Python from .python-version
        uses: actions/setup-python@v4
        with:
          python-version-file: .python-version
      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml
          sudo .github/workflows/deps.py --build-opts ANDROID=1
      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Setup Gradle 8.13
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.13
      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: build-android
          restore-keys: build-android
      - name: "Setup ccache: extra configuration"
        run: "ccache --set-config compiler_check=content"
      - name: "Setup ccache: prepend path"
        run: "echo /usr/lib/ccache >> $GITHUB_PATH"
      - name: "Setup ccache: update symlinks"
        run: "/usr/sbin/update-ccache-symlinks"
      - name: Ensure version info
        run: bash .claude/scripts/ensure_version_info.sh
      - name: Prepare Android build
        run: make ANDROID="$GITHUB_RUN_NUMBER" TILES=y android -j4
        working-directory: crawl-ref/source
      - name: Run Android launcher unit tests
        run: gradle :app:testDebugUnitTest
        working-directory: crawl-ref/source/android-project
      - name: Build Android four-ABI debug APK
        run: gradle :app:assembleDebug
        working-directory: crawl-ref/source/android-project
      - name: Validate packaged PCRE linkage for every Android ABI
        run: |
          set -euo pipefail
          sdk_root="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          readelf="$sdk_root/ndk/28.2.13676358/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf"
          [[ -x "$readelf" ]]
          bash .claude/scripts/check_android_pcre_apk.sh \
            --apk crawl-ref/source/android-project/app/build/outputs/apk/debug/app-debug.apk \
            --llvm-readelf "$readelf"
      - name: Sign Android debug APK for test updates
        if: ${{ github.event_name != 'pull_request' }}
        shell: bash
        working-directory: crawl-ref/source/android-project
        env:
          ANDROID_TEST_KEYSTORE_BASE64: ${{ secrets.ANDROID_TEST_KEYSTORE_BASE64 }}
          ANDROID_TEST_KEYSTORE_PASS: ${{ secrets.ANDROID_TEST_KEYSTORE_PASS }}
          ANDROID_TEST_KEY_ALIAS: ${{ secrets.ANDROID_TEST_KEY_ALIAS }}
        run: |
          set -euo pipefail
          umask 077
          keystore="$RUNNER_TEMP/android-test.keystore"
          trap 'rm -f "$keystore"' EXIT
          printf '%s' "$ANDROID_TEST_KEYSTORE_BASE64" \
            | base64 --decode > "$keystore"
          [[ -s "$keystore" ]]
          debug_apk="$PWD/app/build/outputs/apk/debug/app-debug.apk"
          aligned_apk="$RUNNER_TEMP/app-debug-aligned.apk"
          signed_apk="$RUNNER_TEMP/app-debug-test-signed.apk"
          sdk_root="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          build_tools="$(find "$sdk_root/build-tools" -mindepth 1 -maxdepth 1 \
            -type d -print | LC_ALL=C sort -V | tail -1)"
          zipalign="$build_tools/zipalign"
          apksigner="$build_tools/apksigner"
          [[ -s "$debug_apk" ]]
          [[ -x "$zipalign" ]]
          [[ -x "$apksigner" ]]
          "$zipalign" -p -f 4 "$debug_apk" "$aligned_apk"
          export ANDROID_TEST_STORE_PASSWORD="$ANDROID_TEST_KEYSTORE_PASS"
          export ANDROID_TEST_PRIVATE_KEY_PASSWORD="$ANDROID_TEST_KEYSTORE_PASS"
          "$apksigner" sign \
            --ks "$keystore" \
            --ks-key-alias "$ANDROID_TEST_KEY_ALIAS" \
            --ks-pass env:ANDROID_TEST_STORE_PASSWORD \
            --key-pass env:ANDROID_TEST_PRIVATE_KEY_PASSWORD \
            --out "$signed_apk" "$aligned_apk"
          verify_output="$("$apksigner" verify --verbose --print-certs \
            "$signed_apk")"
          printf '%s\n' "$verify_output"
          cert_digest="$(sed -nE \
            's/^(V[0-9.]+ )?Signer( #[0-9]+)?:? certificate SHA-256 digest: //p' \
            <<<"$verify_output")"
          [[ "$cert_digest" == "$ANDROID_TEST_CERT_SHA256" ]]
          mv "$signed_apk" "$debug_apk"
      - name: Upload Android test APK
        if: ${{ github.event_name != 'pull_request' }}
        uses: actions/upload-artifact@v4
        with:
          name: android-debug-apk
          path: crawl-ref/source/android-project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Upload Android PR debug APK
        if: ${{ github.event_name == 'pull_request' }}
        uses: actions/upload-artifact@v4
        with:
          name: android-pr-debug-apk
          path: crawl-ref/source/android-project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Build and sign Android release APK
        if: ${{ startsWith(github.ref, 'refs/tags/0.34.1-zh') }}
        shell: bash
        working-directory: crawl-ref/source/android-project
        env:
          ANDROID_KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASS }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASS: ${{ secrets.ANDROID_KEY_PASS }}
        run: |
          set -euo pipefail
          gradle :app:assembleRelease
          unsigned="$PWD/app/build/outputs/apk/release/app-release-unsigned.apk"
          aligned="$RUNNER_TEMP/app-release-aligned.apk"
          signed="$GITHUB_WORKSPACE/stone_soup-${GITHUB_REF_NAME}-android.apk"
          sdk_root="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          build_tools="$(find "$sdk_root/build-tools" -mindepth 1 -maxdepth 1 \
            -type d -print | LC_ALL=C sort -V | tail -1)"
          zipalign="$build_tools/zipalign"
          apksigner="$build_tools/apksigner"
          [[ -s "$unsigned" ]]
          [[ -x "$zipalign" ]]
          [[ -x "$apksigner" ]]
          "$zipalign" -p -f 4 "$unsigned" "$aligned"
          export ANDROID_STORE_PASSWORD="$ANDROID_KEYSTORE_PASS"
          export ANDROID_PRIVATE_KEY_PASSWORD="${ANDROID_KEY_PASS:-$ANDROID_KEYSTORE_PASS}"
          "$apksigner" sign \
            --ks "$RUNNER_TEMP/android-release.keystore" \
            --ks-key-alias "$ANDROID_KEY_ALIAS" \
            --ks-pass env:ANDROID_STORE_PASSWORD \
            --key-pass env:ANDROID_PRIVATE_KEY_PASSWORD \
            --out "$signed" "$aligned"
          "$apksigner" verify --verbose --print-certs "$signed"
          [[ -s "$signed" ]]
      - name: Validate release APK PCRE linkage for every Android ABI
        if: ${{ startsWith(github.ref, 'refs/tags/0.34.1-zh') }}
        run: |
          set -euo pipefail
          sdk_root="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          readelf="$sdk_root/ndk/28.2.13676358/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf"
          [[ -x "$readelf" ]]
          bash .claude/scripts/check_android_pcre_apk.sh \
            --apk "stone_soup-${GITHUB_REF_NAME}-android.apk" \
            --llvm-readelf "$readelf"
      - name: Upload Android release APK
        if: ${{ startsWith(github.ref, 'refs/tags/0.34.1-zh') }}
        uses: actions/upload-artifact@v4
        with:
          name: android-release-apk
          path: stone_soup-${{ github.ref_name }}-android.apk
          if-no-files-found: error

  release_draft:
    if: ${{ startsWith(github.ref, 'refs/tags/0.34.1-zh') }}
    needs:
      - zh_tooling_tests
      - zh_ci_gate
      - zh_runtime_catch2
      - zh_runtime_full
      - zh_help_runtime
      - linting
      - build_macos_tiles
      - build_windows_tiles
      - build_android
    permissions:
      contents: write

    name: Create verified draft release
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0
      - name: Set up Python from .python-version
        uses: actions/setup-python@v4
        with:
          python-version-file: .python-version
      - name: Download Windows package
        uses: actions/download-artifact@v4
        with:
          name: windows-tiles
          path: ${{ runner.temp }}/release-assets
      - name: Download macOS package
        uses: actions/download-artifact@v4
        with:
          name: macos-tiles-app
          path: ${{ runner.temp }}/release-assets
      - name: Download Android package
        uses: actions/download-artifact@v4
        with:
          name: android-release-apk
          path: ${{ runner.temp }}/release-assets
      - name: Validate closed-world release artifact set
        shell: bash
        run: |
          set -euo pipefail
          sdk_root="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          apksigner=""
          for candidate in "$sdk_root"/build-tools/*/apksigner; do
            if [[ -x "$candidate" ]]; then
              apksigner="$candidate"
              break
            fi
          done
          [[ -n "$apksigner" ]]
          python3 .claude/scripts/verify_release_artifacts.py \
            --artifacts-dir "$RUNNER_TEMP/release-assets" \
            --source-root "$GITHUB_WORKSPACE" \
            --tag "$GITHUB_REF_NAME" \
            --commit "$GITHUB_SHA" \
            --apksigner "$apksigner" \
            --checksums "$RUNNER_TEMP/SHA256SUMS" \
            --manifest "$RUNNER_TEMP/RELEASE-MANIFEST.txt"
          mv "$RUNNER_TEMP/SHA256SUMS" "$RUNNER_TEMP/release-assets/"
          mv "$RUNNER_TEMP/RELEASE-MANIFEST.txt" "$RUNNER_TEMP/release-assets/"
      - name: Prepare release notes
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "# DCSS 中文版 $GITHUB_REF_NAME"
            echo
            echo "基于上游 DCSS 0.34.1 的中文版。发布身份绑定提交 \`$GITHUB_SHA\`。"
            echo
            echo "## 主要内容"
            echo
            echo "- 中文界面、游戏文本与 ZH TextDB。"
            echo "- Tiles 模式的 CJK 字宽与中英文混排支持。"
            echo "- 随包提供 Maple Mono NF CN 字体及其许可证。"
            echo
            echo "## 支持平台"
            echo
            echo "- Windows Tiles：便携 ZIP，解压后运行 \`crawl.exe\`。"
            echo "- macOS Tiles：ad-hoc 签名 DMG，打开后运行 \`Dungeon Crawl Stone Soup - Tiles.app\`。首次启动仍可能需按 Gatekeeper 提示选择\"打开\"，或在\"系统设置 → 隐私与安全性\"中选择\"仍要打开\"。"
            echo "  若系统仍拦截，可在已将应用拖出 DMG 后执行 \`xattr -dr com.apple.quarantine \\\"Dungeon Crawl Stone Soup - Tiles.app\\\"\`；ad-hoc 签名只封存应用内容，不代表 Apple Developer 签名或公证。"
            echo "- Android：签名的四 ABI APK，下载后按系统提示安装。"
            echo
            echo "## 延期平台"
            echo
            echo "- Linux：仅保留 CI 编译验证。"
            echo
            echo "## 下载校验"
            echo
            echo "请使用 \`SHA256SUMS\` 校验 Windows ZIP、macOS DMG 与 Android APK；\`RELEASE-MANIFEST.txt\` 记录标签、准确提交和资产摘要。"
            echo
            echo "本 Release 由自动流程创建为草稿；完成 Windows、macOS 与 Android 真机的启动、中文显示、新游戏、帮助和存读档验收后方可公开。"
          } > "$RUNNER_TEMP/release-notes.md"
      - name: Create draft release once
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          title="DCSS 中文版 $GITHUB_REF_NAME"
          assets=()
          while IFS= read -r asset; do
            assets[${#assets[@]}]="$asset"
          done < <(find "$RUNNER_TEMP/release-assets" \
            -maxdepth 1 -type f -print | LC_ALL=C sort)
          if [[ ${#assets[@]} -ne 5 ]]; then
            echo "Expected 5 release assets after evidence generation" >&2
            exit 1
          fi
          gh release create "$GITHUB_REF_NAME" "${assets[@]}" \
            --draft --verify-tag --title "$title" \
            --notes-file "$RUNNER_TEMP/release-notes.md"
