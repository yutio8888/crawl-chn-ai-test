name: Build

on:
  push:
    branches:
      - chn-0.34.1-base
  pull_request:
    branches:
      - chn-0.34.1-base
  schedule:
    - cron: '17 18 * * *'
  workflow_dispatch:
    inputs:
      run_full_runtime:
        description: 'Run full runtime tests (L1+L2+L3, slow)'
        type: boolean
        default: false

permissions: {}
jobs:
  zh_tooling_tests:
    permissions:
      contents: read

    name: ZH Tooling Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0
      - name: Set up Python 3.13
        uses: actions/setup-python@v4
        with:
          python-version: 3.13
      - name: Install tooling test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install tree-sitter==0.26.0 tree-sitter-cpp==0.23.4 pyyaml
      - name: Run tooling tests
        run: bash .claude/scripts/tests/run_all.sh

  zh_ci_gate:
    permissions:
      contents: read

    name: ZH CI Gate (static + data, no make)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0
      - name: Set up Python 3.13
        uses: actions/setup-python@v4
        with:
          python-version: 3.13
      - name: Install static check dependencies
        run: |
          python -m pip install --upgrade pip
          pip install tree-sitter==0.26.0 tree-sitter-cpp==0.23.4 pyyaml
      - name: Run Chinese localization CI gate (static only)
        run: bash .claude/scripts/verify_zh.sh --profile ci

  zh_runtime_catch2:
    permissions:
      contents: read

    name: ZH Runtime Catch2 ([zh-translation] + [message-overlay])
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0
          submodules: true
      - name: Set up Python 3.13
        uses: actions/setup-python@v4
        with:
          python-version: 3.13
      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml
          sudo .github/workflows/deps.py --compiler gcc --build-opts "" --debug-opts "FULLDEBUG=1"
      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: zh-runtime-catch2
          restore-keys: zh-runtime-catch2
      - name: "Setup ccache: prepend path"
        run: "echo /usr/lib/ccache >> $GITHUB_PATH"
      - name: "Setup ccache: update symlinks"
        run: "/usr/sbin/update-ccache-symlinks"
      - name: Ensure version info
        run: |
          git describe 2>/dev/null > crawl-ref/source/util/release_ver \
            || echo "0.0.0-dev0" > crawl-ref/source/util/release_ver
      - name: Build catch2-tests and run [zh-translation] + [message-overlay]
        run: bash .claude/scripts/post_zh_runtime.sh catch2
        env:
          TERM: dumb

  zh_runtime_full:
    permissions:
      contents: read

    name: ZH Runtime Full (L1+L2+L3)
    if: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && github.event.inputs.run_full_runtime == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0
          submodules: true
      - name: Set up Python 3.13
        uses: actions/setup-python@v4
        with:
          python-version: 3.13
      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml
          sudo .github/workflows/deps.py --compiler gcc --build-opts "" --debug-opts "FULLDEBUG=1"
      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: zh-runtime-full
          restore-keys: zh-runtime-full
      - name: "Setup ccache: prepend path"
        run: "echo /usr/lib/ccache >> $GITHUB_PATH"
      - name: "Setup ccache: update symlinks"
        run: "/usr/sbin/update-ccache-symlinks"
      - name: Ensure version info
        run: |
          git describe 2>/dev/null > crawl-ref/source/util/release_ver \
            || echo "0.0.0-dev0" > crawl-ref/source/util/release_ver
      - name: Build and run full ZH runtime (L1+L2+L3)
        run: bash .claude/scripts/post_zh_runtime.sh full
        env:
          TERM: dumb

  zh_help_runtime:
    permissions:
      contents: read

    name: ZH Help Runtime Tests (Issue 52)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0
          submodules: true
      - name: Set up Python 3.13
        uses: actions/setup-python@v4
        with:
          python-version: 3.13
      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install tree-sitter==0.26.0 tree-sitter-cpp==0.23.4 pyyaml
          sudo .github/workflows/deps.py --compiler gcc --build-opts "" --debug-opts "FULLDEBUG=1"
      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: zh-help-runtime
          restore-keys: zh-help-runtime
      - name: "Setup ccache: prepend path"
        run: "echo /usr/lib/ccache >> $GITHUB_PATH"
      - name: "Setup ccache: update symlinks"
        run: "/usr/sbin/update-ccache-symlinks"
      - name: Ensure version info
        run: |
          git describe 2>/dev/null > crawl-ref/source/util/release_ver \
            || echo "0.0.0-dev0" > crawl-ref/source/util/release_ver
      - name: Build and run help-system runtime tests
        run: bash .claude/scripts/post_zh_runtime.sh help-full
        env:
          TERM: dumb

  linting:
    permissions:
      contents: read #  to fetch code (actions/checkout)

    name: Code Linting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0 # all history - Checkconventioncommit needs to know which commits are being merged
      - name: Checkwhite
        run: util/checkwhite -n
        working-directory: crawl-ref/source
      - name: Unbrace
        run: util/unbrace -n
        working-directory: crawl-ref/source
      - name: Checkconventionalcommit # If not in crawl/crawl, or if it's a branch other than master or the release branches, run
        if: (github.repository != 'crawl/crawl' || !(github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/heads/stone_soup-')))
        run: util/checkconventionalcommit.py
        working-directory: crawl-ref/source
        continue-on-error: true

  build_linux_console:
    permissions:
      contents: read

    name: Linux Console (GCC)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0
          submodules: true
      - name: Set up Python 3.13
        uses: actions/setup-python@v4
        with:
          python-version: 3.13
      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml
          sudo .github/workflows/deps.py --compiler gcc --build-opts ""
      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: build-linux-console
          restore-keys: build-linux-console
      - name: "Setup ccache: prepend path"
        run: "echo /usr/lib/ccache >> $GITHUB_PATH"
      - name: "Setup ccache: update symlinks"
        run: "/usr/sbin/update-ccache-symlinks"
      - name: Ensure version info
        run: |
          git describe 2>/dev/null > crawl-ref/source/util/release_ver \
            || echo "0.0.0-dev0" > crawl-ref/source/util/release_ver
      - name: Build Linux console
        run: make -j4
        working-directory: crawl-ref/source

  build_macos_tiles:
    permissions:
      contents: read

    name: macOS Tiles App
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0
          submodules: true
      - name: Set up Python 3.13
        uses: actions/setup-python@v4
        with:
          python-version: 3.13
      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml
      - name: Ensure version info
        run: |
          git describe 2>/dev/null > crawl-ref/source/util/release_ver \
            || echo "0.0.0-dev0" > crawl-ref/source/util/release_ver
      - name: Build macOS tiles app
        run: make -j4 TILES=y mac-app-tiles
        working-directory: crawl-ref/source
      - name: Upload macOS tiles app
        uses: actions/upload-artifact@v4
        with:
          name: macos-tiles-app
          path: crawl-ref/source/mac-app-zips/*.zip
          if-no-files-found: error

  build_windows_tiles:
    permissions:
      contents: read

    name: Windows Tiles (MinGW64 cross-compile)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0
          submodules: true
      - name: Set up Python 3.13
        uses: actions/setup-python@v4
        with:
          python-version: 3.13
      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml
          sudo .github/workflows/deps.py --crosscompile --build-opts TILES=1
      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: build-windows-tiles
          restore-keys: build-windows-tiles
      - name: "Setup ccache: prepend path"
        run: "echo /usr/lib/ccache >> $GITHUB_PATH"
      - name: "Setup ccache: update symlinks"
        run: "/usr/sbin/update-ccache-symlinks"
      - name: Ensure version info
        run: |
          git describe 2>/dev/null > crawl-ref/source/util/release_ver \
            || echo "0.0.0-dev0" > crawl-ref/source/util/release_ver
      - name: Build Windows tiles executable
        run: make CROSSHOST=x86_64-w64-mingw32 TILES=y -j4
        working-directory: crawl-ref/source

  build_android:
    permissions:
      contents: read

    name: Android (buildTest)
    runs-on: ubuntu-latest
    env:
      NDK_CCACHE: ccache
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0
          submodules: true
      - name: Set up Python 3.13
        uses: actions/setup-python@v4
        with:
          python-version: 3.13
      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml
          sudo .github/workflows/deps.py --build-opts ANDROID=1
      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Setup Gradle 8.13
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.13
      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: build-android
          restore-keys: build-android
      - name: "Setup ccache: extra configuration"
        run: "ccache --set-config compiler_check=content"
      - name: "Setup ccache: prepend path"
        run: "echo /usr/lib/ccache >> $GITHUB_PATH"
      - name: "Setup ccache: update symlinks"
        run: "/usr/sbin/update-ccache-symlinks"
      - name: Ensure version info
        run: |
          git describe 2>/dev/null > crawl-ref/source/util/release_ver \
            || echo "0.0.0-dev0" > crawl-ref/source/util/release_ver
      - name: Prepare Android build
        run: make ANDROID=1 TILES=y android -j4
        working-directory: crawl-ref/source
      - name: Build Android buildTest APK
        run: gradle :app:assembleBuildTest
        working-directory: crawl-ref/source/android-project
