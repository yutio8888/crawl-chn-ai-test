name: Windows Console test package
'on':
  workflow_dispatch: {}
permissions: {}
jobs:
  build_windows_console:
    permissions:
      contents: read
    name: Windows Console test package
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
      with:
        fetch-depth: 0
        submodules: true
    - name: Verify candidate source tree
      shell: bash
      run: test "$(git rev-parse HEAD:crawl-ref/source)" = "f850bf7f8c59debd08374c853330ccba383c69fe"
    - name: Set up Python from .python-version
      uses: actions/setup-python@v4
      with:
        python-version-file: .python-version
    - name: Install build dependencies
      run: 'python -m pip install --upgrade pip

        pip install pyyaml

        sudo .github/workflows/deps.py --crosscompile --build-opts ""

        '
    - name: Setup ccache
      uses: hendrikmuhs/ccache-action@v1.2
      with:
        key: build-windows-console
        restore-keys: build-windows-console
    - name: 'Setup ccache: prepend path'
      run: echo /usr/lib/ccache >> $GITHUB_PATH
    - name: 'Setup ccache: update symlinks'
      run: /usr/sbin/update-ccache-symlinks
    - name: Ensure version info
      run: bash .claude/scripts/ensure_version_info.sh
    - name: Build Windows console
      shell: bash
      env:
        RELEASE_PACKAGE: 'true'
      run: "targets=()\nif [[ \"$RELEASE_PACKAGE\" == 'true' ]]; then\n  targets+=(package-windows-console)\nfi\nmake CROSSHOST=x86_64-w64-mingw32\
        \ \"${targets[@]}\" -j4\n"
      working-directory: crawl-ref/source
    - name: Upload Windows console package
      uses: actions/upload-artifact@v4
      with:
        name: windows-console
        path: 'crawl-ref/source/stone_soup-*-console-win32.zip

          !crawl-ref/source/stone_soup-latest-console-win32.zip

          '
        if-no-files-found: error
    timeout-minutes: 45
